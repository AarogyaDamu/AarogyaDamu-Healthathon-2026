# AarogyaDamu — Render Free + Neon Free Public Hosted Demo Blueprint
# Uses external Neon Free PostgreSQL (`aarogyadamu-release-demo`) and three
# Render Free services (`aarogyadamu-api`, `aarogyadamu-doctor-web`,
# `aarogyadamu-patient-web`) with `APP_ENV=staging` and no paid add-ons.
# Secret values marked `sync: false` must be populated in the Render Dashboard.

services:
  # ---------------------------------------------------------------------------
  # 1. Core API Web Service (Node.js 22.23.5 + Express + Prisma + RLS)
  # ---------------------------------------------------------------------------
  - type: web
    name: aarogyadamu-api
    runtime: node
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /health/ready
    buildCommand: npm ci --include=dev && npm run build:contracts && npm run build:api
    startCommand: npm --workspace=services/api run db:deploy:hosted && npm --workspace=services/api start
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: TRUST_PROXY
        value: '1'
      - key: RATE_LIMIT_STORE
        value: memory
      - key: ALLOW_DEMO_AUTH
        value: 'false'
      - key: ENABLE_DEV_DEMO_MODE
        value: 'false'
      - key: ALLOW_PUBLIC_DOCTOR_REGISTRATION
        value: 'false'
      - key: ALLOW_PUBLIC_PASSWORD_RESET
        value: 'false'
      - key: ALLOW_ROBOTIC_VOICE_FALLBACK
        value: 'false'
      - key: ENABLE_AGENT_EXPIRY_WORKER
        value: 'true'
      - key: AGENT_EXPIRY_INTERVAL_MS
        value: '900000'
      - key: EMAIL_PROVIDER
        value: disabled
      - key: MEDICAL_REPORT_OCR_PROVIDER
        value: sarvam
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: aarogyadamu-api
      - key: JWT_AUDIENCE
        value: aarogyadamu-clients
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: '30'
      # Expected Neon Free project identity (hostname only, direct endpoint without -pooler, protocol, path, or query)
      - key: EXPECTED_NEON_ENDPOINT
        sync: false
      - key: EXPECTED_NEON_OWNER_ROLE
        value: neondb_owner
      # Neon Free direct owner connection for role preflight, prisma migrate deploy, and _security_vault sync
      - key: MIGRATION_DATABASE_URL
        sync: false
      # Neon Free pooled restricted runtime connection using non-owner `aarogyadamu_app` role (enforces RLS & append-only AuditLog)
      - key: DATABASE_URL
        sync: false
      - key: APP_RUNTIME_DB_PASSWORD
        sync: false
      # Auto-generated distinct 256-bit cryptographic secrets
      - key: JWT_SECRET
        generateValue: true
      - key: RLS_CONTEXT_SECRET
        generateValue: true
      - key: DOCTOR_INVITATION_SECRET
        generateValue: true
      - key: DOCTOR_INVITATION_ADMIN_KEY
        generateValue: true
      # Hosted public origins & URLs (exact origin matching, HTTPS only, no wildcards)
      - key: WEB_APP_URL
        value: https://aarogyadamu-doctor-web.onrender.com
      - key: API_PUBLIC_URL
        value: https://aarogyadamu-api.onrender.com/api
      - key: FHIR_SERVER_URL
        value: https://aarogyadamu-api.onrender.com/api/fhir/r4
      - key: ALLOWED_ORIGINS
        value: https://aarogyadamu-doctor-web.onrender.com,https://aarogyadamu-patient-web.onrender.com
      # Clinical OCR & conversational AI integrations (free/BYOK keys stored securely in Render)
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Doctor Workstation Static Site (Vite + React SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: aarogyadamu-doctor-web
    runtime: static
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build:contracts && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: VITE_APP_ENV
        value: staging
      - key: VITE_API_URL
        value: https://aarogyadamu-api.onrender.com/api
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # 3. Patient Companion Static Site (Expo Web Single-Page Export)
  # ---------------------------------------------------------------------------
  - type: web
    name: aarogyadamu-patient-web
    runtime: static
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build:contracts && npm run build:mobile:web
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: EXPO_PUBLIC_APP_ENV
        value: staging
      - key: EXPO_PUBLIC_API_URL
        value: https://aarogyadamu-api.onrender.com/api
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

