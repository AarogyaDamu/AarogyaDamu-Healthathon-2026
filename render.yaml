# AarogyaDamu — Render Production Blueprint Specification
# All secret values, cloud credentials, and origin URLs marked `sync: false`
# must be configured in the Render Dashboard prior to the first live deploy.

databases:
  - name: aarogyadamu-production-db
    databaseName: aarogyadamu_production
    user: aarogyadamu_db_owner
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"

services:
  # ---------------------------------------------------------------------------
  # 1. Core API Web Service (Node.js 22.23.5 + Express + Prisma + RLS)
  # ---------------------------------------------------------------------------
  - type: web
    name: aarogyadamu-api
    runtime: node
    plan: starter
    region: singapore
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm run build:contracts && npm run build:api
    preDeployCommand: npm --workspace=services/api run prisma:deploy && npm --workspace=services/api run db:provision
    startCommand: npm --workspace=services/api start
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: RATE_LIMIT_STORE
        value: memory
      - key: ALLOW_DEMO_AUTH
        value: 'false'
      - key: ENABLE_DEV_DEMO_MODE
        value: 'false'
      - key: ALLOW_ROBOTIC_VOICE_FALLBACK
        value: 'false'
      - key: ENABLE_AGENT_EXPIRY_WORKER
        value: 'true'
      - key: AGENT_EXPIRY_INTERVAL_MS
        value: '900000'
      - key: EMAIL_PROVIDER
        value: resend
      - key: MEDICAL_REPORT_OCR_PROVIDER
        value: google_vision
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: aarogyadamu-api
      - key: JWT_AUDIENCE
        value: aarogyadamu-clients
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: '30'
      # Internal owner connection used only by preDeployCommand (prisma migrate deploy + security vault sync)
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: aarogyadamu-production-db
          property: connectionString
      # Runtime connection using restricted non-owner `aarogyadamu_app` role (enforces RLS & append-only AuditLog)
      - key: DATABASE_URL
        sync: false
      - key: APP_RUNTIME_DB_PASSWORD
        sync: false
      # Auto-generated distinct 256-bit cryptographic secrets
      - key: JWT_SECRET
        generateValue: true
      - key: RLS_CONTEXT_SECRET
        generateValue: true
      - key: DOCTOR_INVITATION_SECRET
        generateValue: true
      - key: DOCTOR_INVITATION_ADMIN_KEY
        generateValue: true
      # Public origins & URLs (HTTPS only, exact origin matching, no wildcards)
      - key: WEB_APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: FHIR_SERVER_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Email delivery (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Private GCS object storage & Google Cloud Vision OCR
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_CLOUD_STORAGE_BUCKET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # Optional clinical AI & voice integrations
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Doctor Workstation Static Site (Vite + React SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: aarogyadamu-doctor
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:contracts && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: VITE_APP_ENV
        value: production
      # Must be set to https://<api-domain>/api prior to building static bundle
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # 3. Patient Companion Static Site (Expo Web Single-Page Export)
  # ---------------------------------------------------------------------------
  - type: web
    name: aarogyadamu-patient
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:contracts && npm run build:mobile:web
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: EXPO_PUBLIC_APP_ENV
        value: production
      # Must be set to https://<api-domain>/api prior to building Expo web bundle
      - key: EXPO_PUBLIC_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

