name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aarogyadamu
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: aarogyadamu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aarogyadamu -d aarogyadamu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Validate migrations on a disposable PostgreSQL database
        run: npm --workspace=services/api run prisma:deploy
        env:
          DATABASE_URL: postgresql://aarogyadamu:ci-postgres-password@localhost:5432/aarogyadamu_test?schema=public
      - run: npm run typecheck
        env:
          VITE_APP_ENV: staging
          VITE_API_URL: https://api.staging.invalid/api
      - run: npm test
        env:
          AAROGYADAMU_TEST_DATABASE_URL: postgresql://aarogyadamu:ci-postgres-password@localhost:5432/aarogyadamu_test?schema=public
