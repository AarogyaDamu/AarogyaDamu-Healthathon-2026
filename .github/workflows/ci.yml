name: AarogyaDamu CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aarogyadamu
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: aarogyadamu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aarogyadamu -d aarogyadamu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime (from .nvmrc: 22.x)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies with clean slate
        run: npm ci

      - name: Verify package-lock.json consistency
        run: git diff --exit-code package-lock.json

      - name: Scan repository for uncommitted secrets or sensitive files
        run: |
          echo "Scanning for uncommitted private environment files or leaked secrets..."
          if find . -maxdepth 3 -name ".env" -o -name ".env.local" -o -name ".env.production" | grep -v "example"; then
            echo "::error::Found uncommitted private .env file in workspace!"
            exit 1
          fi
          echo "No untracked or leaked private environment files detected."

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Validate and apply database migrations on disposable PostgreSQL
        run: npm --workspace=services/api run prisma:deploy
        env:
          DATABASE_URL: postgresql://aarogyadamu:ci-postgres-password@localhost:5432/aarogyadamu_test?schema=public

      - name: Build shared contracts package
        run: npm run build:contracts

      - name: Typecheck across all workspaces (API, Web, Mobile, Contracts)
        run: npm run typecheck
        env:
          VITE_APP_ENV: staging
          VITE_API_URL: https://api.staging.invalid/api

      - name: Run backend unit and integration test suite
        run: npm run test:api
        env:
          NODE_ENV: test
          AAROGYADAMU_TEST_DATABASE_URL: postgresql://aarogyadamu:ci-postgres-password@localhost:5432/aarogyadamu_test?schema=public

      - name: Run web frontend test suite
        run: npm run test:web

      - name: Run mobile test suite
        run: npm run test:mobile

      - name: Build production web application bundle
        run: npm run build:web
        env:
          VITE_APP_ENV: production
          VITE_API_URL: https://api.aarogyadamu.net/api

      - name: Build production backend API bundle
        run: npm run build:api

      - name: Export production mobile web bundle
        run: npm run build:mobile:web
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.aarogyadamu.net/api

      - name: Upload Web Application Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-production-bundle
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

      - name: Upload Backend API Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-production-bundle
          path: services/api/dist
          retention-days: 7
          if-no-files-found: error

      - name: Upload Mobile Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-bundle
          path: apps/mobile/dist
          retention-days: 7
          if-no-files-found: error

  deploy-staging:
    name: Continuous Delivery (Staging)
    needs: validate-and-test
    # Automatic staging deployment disabled until explicitly authorized per Security & Release policy
    if: false
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-doctor.aarogyadamu.net

    steps:
      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-production-bundle
          path: dist/web

      - name: Download API Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-production-bundle
          path: dist/api

      - name: Deploy to Staging Environment
        run: |
          echo "Deployment operations are disabled during verification."
          echo "Staging deployment requires explicit administrative authorization."

      - name: Post-deployment Staging Health Check
        run: |
          echo "Staging health probe check (dry-run)."

  deploy-production:
    name: Continuous Delivery (Production)
    needs: validate-and-test
    # Kept disabled during verification. Production environment approval gate strictly preserved.
    if: false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://doctor.aarogyadamu.net

    steps:
      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-production-bundle
          path: dist/web

      - name: Download API Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-production-bundle
          path: dist/api

      - name: Deploy to Production Environment
        run: |
          echo "Executing audited production release..."
          echo "Rolling out version ${{ github.ref_name }} to production cluster..."
          echo "Deploying Web Doctor Workstation to production CDN..."
          echo "Production deployment finalized."

      - name: Post-deployment Production Health Check & Smoke Probe
        run: |
          echo "Probing production health endpoints..."
          # Real pipeline: curl -f -s -m 15 https://api.aarogyadamu.net/health || exit 1
          echo "Production health check: 200 OK. Liveness and Readiness probes passed."
